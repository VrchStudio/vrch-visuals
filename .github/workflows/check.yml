name: Check visuals
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/visuals.py check
      - run: python3 -m unittest discover -s tests -v
  # Future render comparison: pin Chrome, use SwiftShader and fixtures/,
  # warm 120 frames, compare changed definitions in the SAME engine invocation.
  # It remains explicitly skipped until implemented; check success is not GPU acceptance.
  render-comparison:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'SwiftShader comparison is not implemented in phase 1.'
