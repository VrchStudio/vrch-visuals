name: Release visuals
on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version (x.y.z)
        required: true
        type: string
      source_ref:
        description: Full source commit on main
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: official-visuals-publishing
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate source identity
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/visuals.py check
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/shader_lint_test.cjs
      - run: node tests/render_compare.cjs
        timeout-minutes: 20
      - name: Publish verified bundle and index
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 tools/visuals.py publish --version "$VERSION"
